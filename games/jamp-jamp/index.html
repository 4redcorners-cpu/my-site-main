<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Попрыгунчик</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px 8px 14px;
    }
    h1 {
      color: #eee;
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    #wrap {
      position: relative;
      width: min(400px, 96vw);
      aspect-ratio: 2 / 3;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    canvas {
      display: block;
      background: #87ceeb;
      width: 100%;
      height: 100%;
    }
    #gameOver {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      gap: 1rem;
    }
    #gameOver.visible { display: flex; }
    #gameOver h2 { margin: 0; font-size: 2rem; }
    .go-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
    }
    #gameOver button {
      padding: 0.65rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: #fff;
      font-weight: 600;
    }
    #gameOver button:hover { filter: brightness(1.1); }
    #pinScore {
      background: #3f6ef0;
    }
    #leaderboard {
      width: min(320px, 92%);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 10px;
    }
    #leaderboard h3 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 1rem;
      color: #fff;
    }
    #leaderboardList {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 4px;
      max-height: 180px;
      overflow: auto;
    }
    #leaderboardList li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 0.86rem;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
    }
    #leaderboardList li.top-1 {
      background: rgba(255, 215, 0, 0.22);
    }
    #leaderboardList li.top-2 {
      background: rgba(192, 192, 192, 0.2);
    }
    #leaderboardList li.top-3 {
      background: rgba(205, 127, 50, 0.2);
    }
    .lb-rank {
      font-weight: 700;
      min-width: 28px;
    }
    .lb-score {
      font-weight: 700;
    }
    #leaderboardHint {
      margin: 8px 0 0;
      text-align: center;
      color: #c8d3ff;
      font-size: 0.78rem;
    }
    #hint {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
    #mobileControls {
      width: min(400px, 96vw);
      margin-top: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mc-group {
      display: flex;
      gap: 10px;
    }
    .mc-btn {
      min-width: 62px;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 0 12px;
      touch-action: manipulation;
    }
    .mc-btn.jump {
      min-width: 94px;
      background: #ff9800;
      color: #1d1200;
    }
    .mc-btn:active,
    .mc-btn.active {
      filter: brightness(1.2);
      transform: translateY(1px);
    }
    /**
     * Тач-устройства: панель управления закреплена снизу (как геймпад),
     * чтобы кнопки всегда были под пальцами на телефонах и планшетах.
     */
    @media (hover: none) and (pointer: coarse) {
      body {
        /* место под фиксированную панель + safe-area (вырез / home indicator) */
        padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
      }
      #mobileControls {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 100;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: linear-gradient(
          to top,
          rgba(26, 26, 46, 0.97) 0%,
          rgba(26, 26, 46, 0.9) 55%,
          rgba(26, 26, 46, 0.78) 100%
        );
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 -10px 36px rgba(0, 0, 0, 0.45);
      }
      #hint {
        text-align: center;
        max-width: min(400px, 96vw);
        padding: 0 4px;
      }
    }
    @media (max-height: 760px) {
      h1 {
        margin-bottom: 0.35rem;
      }
      #hint {
        margin-top: 0.35rem;
      }
      .mc-btn {
        min-height: 48px;
      }
    }
  </style>
</head>
<body>
  <h1>Попрыгунчик</h1>
  <div id="wrap">
    <canvas id="game" width="400" height="600" aria-label="Игровое поле"></canvas>
    <div id="gameOver" role="dialog" aria-labelledby="goTitle">
      <h2 id="goTitle">Game Over</h2>
      <p id="finalScore"></p>
      <div class="go-actions">
        <button type="button" id="restart">Играть снова</button>
        <button type="button" id="pinScore">Зафиксировать результат</button>
      </div>
      <div id="leaderboard">
        <h3>Топ 5 результатов</h3>
        <ol id="leaderboardList" aria-live="polite"></ol>
        <p id="leaderboardHint">Результаты сортируются от большего к меньшему.</p>
      </div>
    </div>
  </div>
  <p id="hint">← → или A D — движение · Пробел — дополнительный прыжок с земли</p>
  <div id="mobileControls" aria-label="Мобильное управление">
    <div class="mc-group">
      <button type="button" class="mc-btn" id="mcLeft" aria-label="Двигаться влево">←</button>
      <button type="button" class="mc-btn" id="mcRight" aria-label="Двигаться вправо">→</button>
    </div>
    <button type="button" class="mc-btn jump" id="mcJump" aria-label="Прыжок">Jump</button>
  </div>
  <!-- Обычный скрипт (не module): так игра открывается по file:// без локального сервера. -->
  <script src="game.js" defer></script>
</body>
</html>
