<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Попрыгунчик</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    h1 {
      color: #eee;
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    #wrap {
      position: relative;
      width: 400px;
      height: 600px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    canvas {
      display: block;
      background: #87ceeb;
    }
    #gameOver {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      gap: 1rem;
    }
    #gameOver.visible { display: flex; }
    #gameOver h2 { margin: 0; font-size: 2rem; }
    .go-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
    }
    #gameOver button {
      padding: 0.65rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: #fff;
      font-weight: 600;
    }
    #gameOver button:hover { filter: brightness(1.1); }
    #pinScore {
      background: #3f6ef0;
    }
    #leaderboard {
      width: min(320px, 92%);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 10px;
    }
    #leaderboard h3 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 1rem;
      color: #fff;
    }
    #leaderboardList {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 4px;
      max-height: 180px;
      overflow: auto;
    }
    #leaderboardList li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 0.86rem;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
    }
    #leaderboardList li.top-1 {
      background: rgba(255, 215, 0, 0.22);
    }
    #leaderboardList li.top-2 {
      background: rgba(192, 192, 192, 0.2);
    }
    #leaderboardList li.top-3 {
      background: rgba(205, 127, 50, 0.2);
    }
    .lb-rank {
      font-weight: 700;
      min-width: 28px;
    }
    .lb-score {
      font-weight: 700;
    }
    #leaderboardHint {
      margin: 8px 0 0;
      text-align: center;
      color: #c8d3ff;
      font-size: 0.78rem;
    }
    #hint {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Попрыгунчик</h1>
  <div id="wrap">
    <canvas id="game" width="400" height="600" aria-label="Игровое поле"></canvas>
    <div id="gameOver" role="dialog" aria-labelledby="goTitle">
      <h2 id="goTitle">Game Over</h2>
      <p id="finalScore"></p>
      <div class="go-actions">
        <button type="button" id="restart">Играть снова</button>
        <button type="button" id="pinScore">Зафиксировать результат</button>
      </div>
      <div id="leaderboard">
        <h3>Топ 5 результатов</h3>
        <ol id="leaderboardList" aria-live="polite"></ol>
        <p id="leaderboardHint">Результаты сортируются от большего к меньшему.</p>
      </div>
    </div>
  </div>
  <p id="hint">← → или A D — движение · Пробел — дополнительный прыжок с земли</p>
  <!-- Обычный скрипт (не module): так игра открывается по file:// без локального сервера. -->
  <script src="game.js" defer></script>
</body>
</html>
